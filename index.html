    * { box-sizing: border-box; }

    body {

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      overflow: hidden;
      position: relative;
    }

    .app-shell::before,
    .app-shell::after {
      content: "";
      position: fixed;
      z-index: 0;
      border-radius: 999px;
      pointer-events: none;
      opacity: .72;
    }

    .app-shell::before {
      width: 210px;
      height: 210px;
      left: -95px;
      top: 310px;
      background: #ffd85a;
    }

    .app-shell::after {
      width: 160px;
      height: 160px;
      right: -62px;
      top: 94px;
      background: #ffb5c3;
    }

    .content-layer { position: relative; z-index: 1; }
    .title-font { font-family: "Fraunces", serif; }

    .sprinkle-bg {
      background-image:

      background-size: 60px 55px;
    }

    .hero-shape {
      position: absolute;
      border: 2px solid rgba(255,255,255,.4);
      border-radius: 46% 54% 58% 42%;
      pointer-events: none;
    }

    .today-panel,
    .child-panel,
    .day-card {
      border: 2px solid var(--line);
      box-shadow: 0 9px 0 rgba(93, 83, 61, .07);
    }

    .today-panel {
      overflow: hidden;
      border-radius: 32px;
    }

    .today-total-note {
      min-height: 84px;
      transform: rotate(-3deg);
      box-shadow: 0 8px 0 rgba(91, 74, 54, .08);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .today-total-note:hover {
      transform: rotate(-1deg) translateY(-2px);
      box-shadow: 0 10px 0 rgba(91, 74, 54, .1);
    }

    .child-panel {
      border-radius: 27px;
      min-height: 300px;
      overflow: hidden;
    }

    .oskar-panel { border-color: #f2c6b5; }
    .irma-panel { border-color: #dcb9ce; }

    .day-card {
      border-radius: 27px;
    }

    .timer-card {
      border: 2px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 5px 0 rgba(91, 74, 54, .07);
      transition: transform .18s ease, box-shadow .18s ease, opacity .2s ease;
    }

    .timer-card > [data-template-id="timer-card-topic"] {
      min-width: 0;
    }

    .timer-card > [data-template-id="timer-clock"] {
      margin-left: auto;
    }

    .timer-card:hover {
      transform: translateY(-3px) rotate(-.25deg);
      box-shadow: 0 9px 0 rgba(91, 74, 54, .1);
    }

    .timer-card.is-failed {
      opacity: .58;
      filter: grayscale(.7);
    }

    .routine-bundle {
      border: 2px solid var(--line);
      border-radius: 22px;
      background: #fffdf9;
      box-shadow: 0 5px 0 rgba(91, 74, 54, .07);
    }

    .routine-start {
      min-width: 0;
      border: 2px solid #ebddcc;
      border-radius: 16px;
      background: #fff8f1;
      color: var(--navy);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .routine-start:hover,
    .timer-card:hover {
      transform: translateY(-2px);
      border-color: var(--orange);
      background: #fff0e8;
    }

    .clock-ring {
      background: conic-gradient(var(--orange) var(--progress), #f5e9db 0);
      transition: background .35s linear;
    }

    .clock-core {
      background: #fffdf9;
      letter-spacing: -.04em;
    }

    .select-chip {
      background: #fffdf9;
      border: 2px solid #ebddcc;
      color: #516071;
      box-shadow: 0 3px 0 rgba(91, 74, 54, .06);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }

    .select-chip:hover {
      transform: translateY(-2px);
      border-color: #ff9b73;
    }

    .select-chip.active {
      background: #245a62;
      border-color: #245a62;
      color: #fff;
      box-shadow: 0 4px 0 rgba(36, 90, 98, .17);
    }

    .modal-backdrop {
      background: rgba(33, 52, 75, .58);
      backdrop-filter: blur(7px);
    }

    .modal-panel { animation: pop .24s cubic-bezier(.2,.8,.3,1); }

    .calendar-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .3s ease;
    }

    .calendar-body.is-collapsed { grid-template-rows: 0fr; }
    .calendar-inner { overflow: hidden; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(18px) scale(.96) rotate(-1deg); }
      to { opacity: 1; transform: none; }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .wiggle { animation: wiggle 2.6s ease-in-out infinite; }

    button:focus-visible {
      outline: 3px solid #ff7792;
      outline-offset: 3px;
    }

      .child-panel { min-height: 0; padding: .85rem; border-radius: 22px; }
      .child-panel .mt-4 { grid-template-columns: minmax(0, 1fr); gap: .65rem; }
      .routine-bundle .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; }
      .timer-card { gap: .45rem; padding: .55rem; border-radius: 15px; }
      .timer-card [data-template-id="timer-card-topic"] { font-size: .78rem; line-height: 1.15; }

      .timer-card [data-template-id="timer-clock"] { align-self: center; }

    }

       </fieldset>
       <fieldset><legend data-template-id="day-label" class="canva-text mb-3 font-bold"></legend>
        <div id="group-day" class="flex flex-wrap gap-2" data-group="day"><button type="button" class="select-chip active rounded-xl px-3 py-2 text-sm font-bold" data-value="today">Heute</button> <button type="button" class="select-chip rounded-xl px-3 py-2 text-sm font-bold" data-value="tomorrow">Morgen</button> <button type="button" class="select-chip rounded-xl px-3 py-2 text-sm font-bold" data-value="all">Alle</button>
        </div>
       </fieldset>
       <fieldset><legend data-template-id="repeat-label" class="canva-text mb-3 font-bold"></legend>
        <div id="group-repeat" class="flex flex-wrap gap-2" data-group="repeat"><button type="button" class="select-chip active rounded-xl px-3 py-2 text-sm font-bold" data-value="1">1×</button> <button type="button" class="select-chip rounded-xl px-3 py-2 text-sm font-bold" data-value="2">2×</button> <button type="button" class="select-chip rounded-xl px-3 py-2 text-sm font-bold" data-value="3">3×</button>
        </div>
       </fieldset>
      </div>
      <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row sm:items-center sm:justify-between">
       <p data-template-id="modal-helper" class="canva-text text-sm"></p><button data-template-id="save-timer-button" type="submit" class="canva-button inline-flex items-center justify-center gap-2 rounded-2xl px-5 py-3 font-bold shadow-md transition hover:-translate-y-1"> <i data-lucide="calendar-plus" width="18" height="18" aria-hidden="true"></i> <span data-template-id="save-timer-button-text" class="canva-text"></span> </button>
      </div>
     </form>
    </div>
   </div>
  </div>
  <div id="result-modal" class="modal-backdrop hidden fixed inset-0 z-50 p-4" role="dialog" aria-modal="true" aria-labelledby="result-title">
   <div class="flex min-h-full items-center justify-center">
    <div class="modal-panel w-full max-w-md rounded-[30px] bg-[#fffaf2] p-7 text-center shadow-2xl">
     <div id="result-icon" class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-[#bfead7] text-3xl">
      🎉
     </div>
     <h2 id="result-title" class="title-font text-2xl font-bold text-[#26364f]"></h2>
     <p id="result-text" class="mt-3 text-[#5d6a78]"></p><button id="btn-close-result" data-template-id="close-result-button" type="button" class="canva-button mt-6 w-full rounded-2xl px-5 py-3 font-bold"> <span data-template-id="close-result-button-text" class="canva-text"></span> </button>
    </div>
   </div>
  </div>
  <template id="timer-card-template">
   <article data-template-id="timer-card" class="canva-card timer-card flex flex-row items-center gap-3 bg-[#fffdf9] p-3 sm:p-4">
    <div class="min-w-0 flex-1">
     <p data-template-id="timer-card-topic" class="canva-text font-bold"></p>
     <p data-template-id="timer-card-helper" class="canva-text mt-1 text-sm"></p>
    </div>
    <div data-template-id="timer-clock" class="canva-progress clock-ring shrink-0 rounded-full p-[4px]">
     <div data-template-id="timer-clock-core" class="canva-text clock-core flex h-12 w-12 items-center justify-center rounded-full text-xs font-bold"></div>
    </div><button data-template-id="timer-action" type="button" class="canva-button shrink-0 rounded-xl px-3 py-2 text-sm font-bold transition"></button>
   </article>
  </template>
  <script>
    (() => {
      "use strict";

      const records = [];
      const completedCounts = { oskar: 0, irma: 0 };
      const dailyRoutines = ["zahne", "anziehen", "umziehen", "zahne"];
      const labels = {
        zahne: ["Zähne", "🪥"],
        anziehen: ["Anziehen", "👕☀️"],
        umziehen: ["Umziehen", "🌙👕"]
      };

      let ticker = null;
      let resultTimeout = null;

      const $ = (id) => document.getElementById(id);

      function setStatus(message, type) {
        const status = $("app-status");
        if (!message) {
          status.className = "hidden";
          status.textContent = "";
          return;
        }

        status.textContent = message;
        status.className = "mb-5 rounded-2xl px-4 py-3 text-sm font-bold";
        status.classList.add(type === "error" ? "bg-[#ffe1dc]" : "bg-[#dff5e8]");
        status.classList.add(type === "error" ? "text-[#a54136]" : "text-[#245a62]");
      }

      function formatDate(offset) {
        const date = new Date();
        date.setDate(date.getDate() + offset);
        return date.toLocaleDateString("de-DE", {
          weekday: "long",
          day: "2-digit",
          month: "2-digit"
        });
      }

      function updateDateHeaders() {
        $("today-date").textContent = formatDate(0);
        $("tomorrow-date").textContent = formatDate(1);
        $("after-tomorrow-date").textContent = formatDate(2);
      }

      function addDailyRoutineCards() {
        ["oskar", "irma"].forEach((person) => {
          dailyRoutines.forEach((topic, routineIndex) => {
            records.push({
              id: "routine-" + person + "-" + topic + "-" + routineIndex,
              person,
              day: "today",
              topic,
              durationSeconds: 5 * 60,
              remainingSeconds: 5 * 60,
              repeatLabel: "",
              status: "idle",
              endTime: null
            });
          });
        });
      }

      function getActiveValue(groupId) {
        const group = $(groupId);
        if (!group) return "";
        return group.dataset.selectedValue || group.querySelector("button.active")?.dataset.value || "";
      }

      function displayTime(seconds) {
        const safeSeconds = Math.max(0, Math.ceil(seconds));
        const minutes = Math.floor(safeSeconds / 60);
        const rest = safeSeconds % 60;
        return String(minutes).padStart(2, "0") + ":" + String(rest).padStart(2, "0");
      }

      function remainingFor(record) {
        if (record.status !== "running" || !record.endTime) return record.remainingSeconds;
        return Math.max(0, Math.ceil((record.endTime - Date.now()) / 1000));
      }

      function createCard(record) {
        const fragment = $("timer-card-template").content.cloneNode(true);
        const card = fragment.querySelector("[data-template-id='timer-card']");
        const topic = fragment.querySelector("[data-template-id='timer-card-topic']");
        const helper = fragment.querySelector("[data-template-id='timer-card-helper']");
        const ring = fragment.querySelector("[data-template-id='timer-clock']");
        const clock = fragment.querySelector("[data-template-id='timer-clock-core']");
        const action = fragment.querySelector("[data-template-id='timer-action']");
        const topicInfo = record.topic.startsWith("free:") ? [record.topic.slice(5), "✨"] : (labels[record.topic] || [record.topic, "✨"]);
        const remaining = remainingFor(record);
        const progress = Math.max(0, Math.min(100, (remaining / record.durationSeconds) * 100));

        card.dataset.recordId = record.id;
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", record.status === "running" ? topicInfo[0] + " fertigstellen" : topicInfo[0] + " starten");
        const activateCard = () => record.status === "running" ? finishTimer(record.id) : startTimer(record.id);
        card.addEventListener("click", (event) => {
          if (event.target.closest("button")) return;
          activateCard();
        });
        card.addEventListener("keydown", (event) => {
          if ((event.key === "Enter" || event.key === " ") && !event.target.closest("button")) {
            event.preventDefault();
            activateCard();
          }
        });
        topic.textContent = topicInfo[1] + " " + topicInfo[0];
        helper.textContent = record.repeatLabel || "";
        ring.style.setProperty("--progress", progress + "%");
        ring.setAttribute("aria-label", "Verbleibende Zeit: " + displayTime(remaining));
        clock.textContent = displayTime(remaining);

        if (record.status === "failed") {
          card.classList.add("is-failed");
          action.textContent = "Zeit um";
          action.disabled = true;
          action.classList.add("cursor-not-allowed", "bg-[#ded8ce]", "text-[#716d66]");
        } else if (record.status === "running") {
          action.textContent = "Fertig";
          action.classList.add("min-w-[116px]", "px-5", "py-4", "text-base", "bg-[#ff7c42]", "text-white", "hover:bg-[#e66631]");
          action.addEventListener("click", () => finishTimer(record.id));
        } else {
          action.textContent = "Start";
          action.classList.add("min-w-[116px]", "px-5", "py-4", "text-base", "bg-[#245a62]", "text-white", "hover:bg-[#194a52]");
          action.addEventListener("click", () => startTimer(record.id));
        }

        return fragment;
      }

      function createRoutineBundle(person) {
        const fragment = document.createDocumentFragment();
        const card = document.createElement("div");
        card.className = "routine-bundle col-span-full p-3 sm:p-4";
        const title = document.createElement("p");
        title.className = "mb-3 text-xs font-bold uppercase tracking-[.12em] text-[#687484]";
        title.textContent = "Tägliche Routine";
        const grid = document.createElement("div");
        grid.className = "grid grid-cols-2 gap-2 sm:grid-cols-4";

        records.filter((record) => record.person === person && record.day === "today" && dailyRoutines.includes(record.topic))
          .forEach((record) => {
            const button = document.createElement("button");
            const remaining = remainingFor(record);
            const progress = Math.max(0, Math.min(100, (remaining / record.durationSeconds) * 100));
            button.type = "button";
            button.className = "routine-start flex flex-col items-center justify-center gap-1 px-2 py-3 text-center font-bold";
            button.dataset.recordId = record.id;
            button.innerHTML = record.status === "running"
              ? `<span class="text-xs leading-tight">${labels[record.topic][0]}</span><span data-template-id="timer-clock" class="clock-ring my-1 rounded-full p-[3px]" style="--progress:${progress}%"><span data-template-id="timer-clock-core" class="clock-core flex h-12 w-12 items-center justify-center rounded-full text-xs font-bold">${displayTime(remaining)}</span></span><span class="rounded-lg bg-[#ff7c42] px-2 py-1 text-[11px] text-white">Fertig</span>`
              : `<span class="text-2xl">${labels[record.topic][1]}</span><span class="text-xs leading-tight">${labels[record.topic][0]}</span><span class="mt-1 rounded-lg bg-[#245a62] px-2 py-1 text-[11px] text-white">Start</span>`;
            button.setAttribute("aria-label", record.status === "running" ? labels[record.topic][0] + " fertigstellen" : labels[record.topic][0] + " starten");
            button.addEventListener("click", () => record.status === "running" ? finishTimer(record.id) : startTimer(record.id));
            grid.appendChild(button);
          });

        card.append(title, grid);
        fragment.appendChild(card);
        return fragment;
      }

      function renderList(listId, emptyId, matchingRecords) {
        const list = $(listId);
        const empty = $(emptyId);
        list.replaceChildren();
        matchingRecords.forEach((record) => list.appendChild(createCard(record)));
        empty.classList.toggle("hidden", matchingRecords.length > 0);
      }

      function renderChildToday(listId, emptyId, person, matchingRecords) {
        const list = $(listId);
        const empty = $(emptyId);
        list.replaceChildren();
        const routines = matchingRecords.filter((record) => dailyRoutines.includes(record.topic));
        if (routines.length) list.appendChild(createRoutineBundle(person));
        matchingRecords.filter((record) => !dailyRoutines.includes(record.topic)).forEach((record) => list.appendChild(createCard(record)));
        empty.classList.toggle("hidden", matchingRecords.length > 0);
      }

      function render() {
        const oskarToday = records.filter((record) => record.person === "oskar" && record.day === "today");
        const irmaToday = records.filter((record) => record.person === "irma" && record.day === "today");
        const tomorrow = records.filter((record) => record.day === "tomorrow");
        const afterTomorrow = records.filter((record) => record.day === "after-tomorrow");

        renderChildToday("list-oskar", "empty-oskar", "oskar", oskarToday);
        renderChildToday("list-irma", "empty-irma", "irma", irmaToday);
        renderList("list-tomorrow", "empty-tomorrow", tomorrow);
        renderList("list-after-tomorrow", "empty-after-tomorrow", afterTomorrow);

        $("tomorrow-count").textContent = tomorrow.length;
        $("after-tomorrow-count").textContent = afterTomorrow.length;
      }

      function startTicker() {
        if (ticker) return;

        ticker = window.setInterval(() => {
          let changed = false;

          records.forEach((record) => {
            if (record.status === "running" && remainingFor(record) <= 0) {
              record.status = "failed";
              record.remainingSeconds = 0;
              record.endTime = null;
              showResult(record, false);
              changed = true;
            }
          });

          if (changed) {
            render();
          } else {
            records.forEach((record) => {
              if (record.status !== "running") return;
              const card = document.querySelector("[data-record-id='" + record.id + "']");
              if (!card) return;

              const clock = card.querySelector("[data-template-id='timer-clock-core']");
              const ring = card.querySelector("[data-template-id='timer-clock']");
              const remaining = remainingFor(record);
              const progress = Math.max(0, Math.min(100, (remaining / record.durationSeconds) * 100));

              clock.textContent = displayTime(remaining);
              ring.style.setProperty("--progress", progress + "%");
              ring.setAttribute("aria-label", "Verbleibende Zeit: " + displayTime(remaining));
            });
          }

          if (!records.some((record) => record.status === "running")) {
            window.clearInterval(ticker);
            ticker = null;
          }
        }, 1000);
      }

      function startTimer(id) {
        const record = records.find((item) => item.id === id);
        if (!record) return;

        record.status = "running";
        record.endTime = Date.now() + record.remainingSeconds * 1000;
        render();
        startTicker();
      }

      function finishTimer(id) {
        const index = records.findIndex((item) => item.id === id);
        if (index === -1) return;

        const record = records[index];
        completedCounts[record.person] += 1;
        records.splice(index, 1);
        render();
        showResult(record, true);
      }

      function showResult(record, success) {
        const topicInfo = record.topic.startsWith("free:") ? [record.topic.slice(5)] : (labels[record.topic] || [record.topic]);
        const personName = record.person === "oskar" ? "Oskar" : "Irma";

        $("result-icon").textContent = success ? "🎉" : "⏰";
        $("result-title").textContent = success ? personName + ", super gemacht!" : personName + ", knapp vorbei";
        $("result-text").textContent = success
          ? "Du hast „" + topicInfo[0] + "“ erfolgreich geschafft."
          : "Die Zeit für „" + topicInfo[0] + "“ ist abgelaufen.";

        $("result-modal").classList.remove("hidden");
        window.clearTimeout(resultTimeout);
        resultTimeout = window.setTimeout(closeResult, 30000);
      }

      function closeResult() {
        $("result-modal").classList.add("hidden");
        window.clearTimeout(resultTimeout);
      }

      function closeTimerModal() {
        $("timer-modal").classList.add("hidden");
      }

      function createTimers(event) {
        event.preventDefault();

        const personValue = getActiveValue("group-person") || "oskar";
        const people = personValue === "both" ? ["oskar", "irma"] : [personValue];
        const dayValue = getActiveValue("group-day") || "today";
        const days = dayValue === "all" ? ["today", "tomorrow", "after-tomorrow"] : [dayValue];
        const repetitions = Number(getActiveValue("group-repeat") || 1);
        const selectedDuration = getActiveValue("group-duration") || "5";
        const minutes = selectedDuration === "custom" ? Number($("custom-duration").value) : Number(selectedDuration);
        if (!Number.isFinite(minutes) || minutes < 1 || minutes > 180) {
          setStatus("Bitte gib eine Dauer zwischen 1 und 180 Minuten ein.", "error");
          return;
        }
        const freeTask = $("free-task").value.trim();
        const topic = freeTask ? "free:" + freeTask : (getActiveValue("group-topic") || "aufraumen");
        let count = 0;

        people.forEach((person) => {
          days.forEach((day) => {
            for (let index = 1; index <= repetitions; index += 1) {
              records.push({
                id: "timer-" + Date.now() + "-" + Math.random().toString(16).slice(2),
                person,
                day,
                topic,
                durationSeconds: minutes * 60,
                remainingSeconds: minutes * 60,
                repeatLabel: repetitions > 1 ? "Aufgabe " + index + " von " + repetitions : "",
                status: "idle",
                endTime: null
              });
              count += 1;
            }
          });
        });

        closeTimerModal();
        render();
        setStatus(count === 1 ? "Die Aufgabe ist im Plan!" : count + " Aufgaben sind jetzt im Plan!", "success");
      }

      function toggleCalendar() {
        const body = $("calendar-body");
        const button = $("btn-toggle-calendar");
        const toggleText = document.querySelector("[data-template-id='calendar-toggle-text']");
        const chevron = $("calendar-chevron");
        const isCollapsed = body.classList.toggle("is-collapsed");

        button.setAttribute("aria-expanded", String(!isCollapsed));
        toggleText.textContent = isCollapsed ? "Plan öffnen" : "Plan schließen";
        chevron.style.transform = isCollapsed ? "rotate(0deg)" : "rotate(180deg)";
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateDateHeaders();
        addDailyRoutineCards();
        render();
        lucide.createIcons();

        document.querySelectorAll("[data-group]").forEach((group) => {
          group.querySelectorAll("button").forEach((button) => {
            button.addEventListener("click", () => {
              group.querySelectorAll("button").forEach((item) => {
                item.classList.remove("active");
                item.setAttribute("aria-pressed", "false");
              });
              button.classList.add("active");
              button.setAttribute("aria-pressed", "true");
              group.dataset.selectedValue = button.dataset.value;
              if (group.id === "group-duration") {
                $("custom-duration-wrap").classList.toggle("hidden", button.dataset.value !== "custom");
                if (button.dataset.value === "custom") $("custom-duration").focus();
              }
            });
          });
        });

        $("btn-open-timer-modal").addEventListener("click", () => $("timer-modal").classList.remove("hidden"));
        $("btn-close-modal").addEventListener("click", closeTimerModal);
        $("btn-close-result").addEventListener("click", closeResult);
        $("btn-toggle-calendar").addEventListener("click", toggleCalendar);
        $("timer-form").addEventListener("submit", createTimers);

        $("timer-modal").addEventListener("click", (event) => {
          if (event.target === $("timer-modal")) closeTimerModal();
        });

        $("result-modal").addEventListener("click", (event) => {
          if (event.target === $("result-modal")) closeResult();
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            updateDateHeaders();
            render();
          }
        });
      });
    })();
  </script>
 </body>
</html>
